# Flatpak manifest for Remarkable.
#
# Two host resources it needs, and how each is reached from a sandbox:
#
#   llama-server — over the network, on 127.0.0.1:8080. `--share=network` is
#     the whole story; there is no process to spawn and no escape needed. The
#     server itself is not bundled, and should not be: it is a 20 GB model and a
#     GPU runtime that the machine already has running for familiar and
#     llama-tray. Remarkable is a client.
#
#   poppler-utils — `pdftoppm`, to rasterise a PDF. Built as a module below
#     rather than reached on the host, because reaching a host binary means
#     --talk-name=org.freedesktop.Flatpak, which is a sandbox escape with a
#     polite name and is rejected by Flathub, correctly. poppler does not rot the
#     way a scraper does: the PDF format is frozen, so a pinned version stays
#     correct.
#
#   the tablet — over the USB network at 10.11.99.1, which is also just the
#     network permission. No device access and no udev rule: the reMarkable
#     presents as an ethernet interface, not as a USB device this talks to
#     directly.
#
# No --filesystem=host. Files arrive through the portal, which is what a drop
# and a file dialog already use.

id: us.hagreli.Remarkable
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: remarkable

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/remarkable/cargo

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  # llama-server on the loopback, and the tablet on the USB network.
  - --share=network

modules:
  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
      - -DENABLE_GLIB=OFF
      - -DENABLE_BOOST=OFF
      - -DBUILD_GTK_TESTS=OFF
      - -DBUILD_CPP_TESTS=OFF
      - -DENABLE_LIBOPENJPEG=none
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-26.07.0.tar.xz
        sha256: 304832f48f8a47fdca90c6b6d1f684e68f37c10c9a0726f345f4ca9df4ca01e2
        x-checker-data:
          type: anitya
          project-id: 3686
          url-template: https://poppler.freedesktop.org/poppler-$version.tar.xz
    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/*.a

  - name: remarkable
    buildsystem: simple
    build-options:
      env:
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release
      - install -Dm755 target/release/remarkable /app/bin/remarkable
      - install -Dm644 data/us.hagreli.Remarkable.desktop
        /app/share/applications/us.hagreli.Remarkable.desktop
      - install -Dm644 data/us.hagreli.Remarkable.metainfo.xml
        /app/share/metainfo/us.hagreli.Remarkable.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/us.hagreli.Remarkable.svg
        /app/share/icons/hicolor/scalable/apps/us.hagreli.Remarkable.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/us.hagreli.Remarkable-symbolic.svg
        /app/share/icons/hicolor/symbolic/apps/us.hagreli.Remarkable-symbolic.svg
    sources:
      - type: dir
        path: ../..
      # Generated by flatpak-cargo-generator.py from Cargo.lock; an offline
      # build cannot reach crates.io.
      - cargo-sources.json
